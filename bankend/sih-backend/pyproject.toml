[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bovine-mastitis-backend"
version = "0.1.0"
description = "AI-Based Predictive Modelling for Early Forecasting of Bovine Mastitis in Indian Dairy Farms"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.108.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic[email]>=2.6.0",
    "pydantic-settings>=2.2.0",
    "motor>=3.3.0",
    "pymongo>=4.6.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.6",
    "apscheduler>=3.10.4",
    "pillow>=11.0.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "pytest-cov==4.1.0",
    "mongomock-motor>=0.0.35",
    "black==23.12.0",
    "ruff==0.1.11",
]
