services:
  mongodb:
    image: mongo:7.0
    container_name: bovine_mastitis_db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: bovine_mastitis
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "admin", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: bovine_mastitis_backend
    environment:
      DATABASE_URL: mongodb://admin:password@mongodb:27017/bovine_mastitis?authSource=admin
      DEBUG: "False"
      SECRET_KEY: change-me-in-production-min-32-chars
    ports:
      - "8000:8000"
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./scripts:/app/scripts
      - ./media:/app/media
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  mongodb_data:
  mongodb_config:

networks:
  default:
    name: bovine_mastitis_network
